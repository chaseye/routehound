name: Daily deal
# Mon, Wed, Fri at 7:17 AM Chicago (13:17 UTC). About 4 SerpApi searches per run.
on:
  schedule:
    - cron: '17 13 * * 1,3,5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/daily-deal.mjs
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      - name: Commit the new deal (Cloudflare redeploys automatically)
        run: |
          if git diff --quiet public/deal.json; then echo "No change"; exit 0; fi
          git config user.name "routehound-bot"
          git config user.email "routehound-bot@users.noreply.github.com"
          git add public/deal.json
          git commit -m "Update daily deal"
          git push
